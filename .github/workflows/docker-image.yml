name: Docker Image Publish

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set docker tag version
      # En tag: usa la versión (ej. v1.0.0). En PR: usa el nombre de rama
      # sanitizado (ej. feat-dockerfile-base-breaking) para poder construir sin tag.
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          echo "RELEASE_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
        else
          echo "RELEASE_VERSION=$(echo '${{ github.head_ref || github.ref_name }}' | tr '/' '-')" >> "$GITHUB_ENV"
        fi
    - name: Test
      run: |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}
    - name: Build & Push to Docker Hub
      # You may pin to the exact commit or the version.
      uses: opspresso/action-docker@master
      with:
          args: --docker
      env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          TAG_NAME: ${{ env.RELEASE_VERSION }}
          BUILDX: "true"
          PLATFORMS: "linux/amd64,linux/arm64"
          IMAGE_NAME: "keitarodxs/aia-utils-base"
          
