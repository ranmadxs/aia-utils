name: Docker Image Publish

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set docker tag version
      # - Tag (vX.Y.Z): usa el nombre del tag tal cual.
      # - Merge a main (push a main): usa la versión del pyproject.toml
      #   (poetry version --short), ej. 1.0.0. Así al mezclar el PR se publica
      #   la imagen release con el tag de la versión del paquete.
      # - PR: usa el nombre de rama sanitizado (ej. feat-dockerfile-base-breaking)
      #   para construir sin tag de release.
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          echo "RELEASE_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
        elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "RELEASE_VERSION=$(poetry version --short)" >> "$GITHUB_ENV"
        else
          echo "RELEASE_VERSION=$(echo '${{ github.head_ref || github.ref_name }}' | tr '/' '-')" >> "$GITHUB_ENV"
        fi
    - name: Test
      run: |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}
    - name: Build & Push to Docker Hub
      # You may pin to the exact commit or the version.
      uses: opspresso/action-docker@master
      with:
          args: --docker
      env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          TAG_NAME: ${{ env.RELEASE_VERSION }}
          BUILDX: "true"
          PLATFORMS: "linux/amd64,linux/arm64"
          IMAGE_NAME: "keitarodxs/aia-utils-base"
          
